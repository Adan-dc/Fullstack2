<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BotilleriaJ&C-sign-up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header class="header-boti">
        <div class="contorno-div">
            <img class="img-boti" src="imagenes/content.png">
            <h1 class="titulo_botilleria">Botilleria J&C</h1>
        </div>

        <nav class="nav-link">
            <a href="index.html" class="links-nav">Home</a>
            <a href="" class="links-nav">Productos</a>
            <a href="" class="links-nav">Nosotros</a>
            <a href="" class="links-nav">Blogs</a>
            <a href="" class="links-nav">Contactos</a>
            <a href="login.html"><img class="img-usuario" src="imagenesbotilleria/usuario.webp"></a>
            <a href=""><img class="img-carrito" src="imagenesbotilleria/carrito.png"></a>
        </nav>
    </header>
    <main class="contenedor-carrito">
        <div class="cabecera-carrito">
            <h1 class="titulo-carrito">Mi carrito de compras</h1>
            <a href="index.html" class="link-seguir">Seguir comprando</a>
        </div>

        <div class="layout-carrito">
            
            <div class="columna-productos">
                
                <div class="encabezado-lista">
                    <span class="encabezado-prod">Producto</span>
                    <span class="encabezado-cant">Cantidad</span>
                    <span class="encabezado-total">Total</span>
                </div>

                <div class="item-carrito">
                    <div class="info-principal">>
                    </div>
                    <div class="controles-item">
                        <div class="selector-cantidad">
                            <button>-</button>
                            <input type="text" value="2" readonly>
                            <button>+</button>
                        </div>
                        <button class="btn-quitar">Quitar</button>
                    </div>
                    <div class="total-item">
                        $5.000
                    </div>
                </div>

            </div>

            <div class="columna-resumen">
                <div class="tarjeta-resumen">
                    <h2>Resumen del pedido</h2>
                    
                    <div class="fila-resumen">
                        <span>Subtotal</span>
                        <span id="resumen-subtotal">$5.000 CLP</span>
                    </div>
                    
                    <p class="nota-envio">Impuestos incluidos. Los gastos de envío se calculan en la pantalla de pago.</p>
                    <div class="fila-total">
                        <span>Total</span>
                        <span id="resumen-total">$5.000 CLP</span>
                    </div>

                    <button class="btn-pagar" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
                </div>
            </div>

        </div>
    </main>
<script>
        const contenedorProductos = document.querySelector('.columna-productos');
        const resumenSubtotal = document.getElementById('resumen-subtotal');
        const resumenTotal = document.getElementById('resumen-total');
        function cargarCarrito() {
            let carrito = JSON.parse(localStorage.getItem('carritoJC')) || [];

            if (carrito.length === 0) {
                contenedorProductos.innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2>Tu carrito está vacío</h2>
                    </div>
                `;
                resumenSubtotal.innerText = '$0 CLP';
                resumenTotal.innerText = '$0 CLP';
                return;
            }

            let htmlCarrito = `
                <div class="encabezado-lista">
                    <span class="encabezado-prod">Producto</span>
                    <span class="encabezado-cant">Cantidad</span>
                    <span class="encabezado-total">Total</span>
                </div>
            `;
            
            let totalPlata = 0;
            carrito.forEach((item, index) => {
                let totalPorItem = item.precio * item.cantidad;
                totalPlata += totalPorItem;

                htmlCarrito += `
                    <div class="item-carrito">
                        <div class="info-principal">
                            <img src="${item.imagen}" alt="Producto">
                            <div class="detalles-item">
                                <p class="marca-item">BOTILLERIA J&C</p>
                                <h3>${item.nombre}</h3>
                                <p class="precio-unitario">$${item.precio.toLocaleString('es-CL')}</p>
                            </div>
                        </div>
                        <div class="controles-item">
                            <div class="selector-cantidad">
                                <button class="btn-restar-car" data-index="${index}">-</button>
                                <input type="text" value="${item.cantidad}" readonly>
                                <button class="btn-sumar-car" data-index="${index}">+</button>
                            </div>
                            <button class="btn-quitar" data-index="${index}">Quitar</button>
                        </div>
                        <div class="total-item">
                            $${totalPorItem.toLocaleString('es-CL')}
                        </div>
                    </div>
                `;
            });

            contenedorProductos.innerHTML = htmlCarrito;
            resumenSubtotal.innerText = `$${totalPlata.toLocaleString('es-CL')} CLP`;
            resumenTotal.innerText = `$${totalPlata.toLocaleString('es-CL')} CLP`;

            activarBotones(carrito);
        }

        function activarBotones(carrito) {

            document.querySelectorAll('.btn-quitar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    carrito.splice(index, 1);
                    localStorage.setItem('carritoJC', JSON.stringify(carrito));
                    cargarCarrito(); // Recargamos la pantalla
                });
            });

            document.querySelectorAll('.btn-sumar-car').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    
                    if (carrito[index].cantidad < carrito[index].stock) {
                        carrito[index].cantidad += 1; 
                        localStorage.setItem('carritoJC', JSON.stringify(carrito));
                        cargarCarrito(); 
                    } else {
                        alert("¡Llegaste al límite, no hay más stock disponible de " + carrito[index].nombre + "!");
                    }
                });
            });

            document.querySelectorAll('.btn-restar-car').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    if (carrito[index].cantidad > 1) {
                        carrito[index].cantidad -= 1;
                        localStorage.setItem('carritoJC', JSON.stringify(carrito));
                        cargarCarrito();
                    }
                });
            });
        }
    cargarCarrito();
    function finalizarPedido() {
    let carrito = JSON.parse(localStorage.getItem('carritoJC')) || [];

    if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
    }

    const usuarioActivo = localStorage.getItem('usuarioActivo');

    if (!usuarioActivo) {
        alert("Debes iniciar sesión para poder finalizar tu pedido.");
        window.location.href = "login.html";
        return;
    }

    alert("¡Compra realizada con éxito! Preparando tu pedido...");

    localStorage.removeItem('carritoJC');

    window.location.reload();
    }
    </script>
    <footer class="pie">Desarrollado por GG AT MC<a href="#"><img class="img" src="imagenes/content.png" alt="J&amp;C"></a></footer>
</body>
</html>
