<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CONTACTO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="contacto.css">
</head>

<body>
  <header class="header-boti">
    <div class="contorno-div">
        <img class="img-boti" src="img/imagen-boti.png" alt="Logo Botillería">
        <h1 class="titulo_botilleria">Botilleria J&C</h1>
    </div>
    <nav class="nav-link">
        <a href="index.html" class="links-nav">Home</a>
        <a href="nosotros.html" class="links-nav">Nosotros</a>
        <a href="blog.html" class="links-nav">Blogs</a>
        <a href="contacto.html" class="links-nav">Contactos</a>
        <a href="login.html"><img class="img-usuario" src="imagenesbotilleria/usuario.webp"></a>
        <a href="carrito.html"><img class="img-carrito" src="imagenesbotilleria/carrito.png"></a>
        <a href="#" class="links-nav" id="btn-logout" style="display: none;" onclick="cerrarSesion()">Salir</a>
    </nav>
  </header>

  <div class="logo-empresa">
    <img src="img/imagen-boti.png" alt="botilleria J&C">
    <h2>botilleria J&C</h2>
  </div>

  <div class="caja-formulario">
    <h3 class="titulo-formulario">Formulario de contacto</h3>

    <form class="formulario-contacto"> <!--esta etiqueta agrupa a todos los campos que el usuario va a llenar-->
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje" required></textarea>
      <button type="submit" class="btn-enviar">Enviar mensaje</button>
    </form>
  </div>
  <script>
      function cerrarSesion() {
      localStorage.removeItem("usuarioActivo");
      localStorage.removeItem("rolUsuario");
      
      alert("¡Sesión cerrada con éxito!");
      window.location.href = "index.html";
  }
  function verificarEstadoSesion() {
        const usuarioActivo = localStorage.getItem("usuarioActivo");
        const btnLogin = document.getElementById("btn-login");
        const btnLogout = document.getElementById("btn-logout");

        if (usuarioActivo) {
            if (btnLogin) btnLogin.style.display = "none";
            if (btnLogout) btnLogout.style.display = "inline";
        } else {
            if (btnLogin) btnLogin.style.display = "inline";
            if (btnLogout) btnLogout.style.display = "none";
        }
    }
    document.addEventListener("DOMContentLoaded", verificarEstadoSesion);
  </script>
  <footer class="pie">Desarrollado por GG AT MC<a href="#"><img class="img" src="img/imagen-boti.png" alt="J&amp;C"></a></footer>
</body>
</html>
