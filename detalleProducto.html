    <script>
        const parametros = new URLSearchParams(window.location.search);
        const idProducto = parametros.get('id');

        if (typeof producto !== 'undefined' && idProducto !== null && producto[idProducto]) {
            const productoElegido = producto[idProducto];

            document.getElementById('img-main').src = productoElegido.imagen;
            document.getElementById('detalle-titulo').innerText = productoElegido.nombre;
            document.getElementById('precio-actual').innerText = '$' + productoElegido.precio.toLocaleString('es-CL');
            
            document.title = productoElegido.nombre + " - Botilleria J&C";
        } else {
            document.getElementById('detalle-titulo').innerText = "Producto no encontrado";
            document.getElementById('img-main').alt = "Error al cargar la imagen";
        }

        const btnSumar = document.getElementById('btn-sumar');
        const btnRestar = document.getElementById('btn-restar');
        const inputCant = document.getElementById('input-cant');

        if (btnSumar && btnRestar && inputCant) {

            btnSumar.addEventListener('click', () => {
                const stockDisponible = producto[idProducto].stock;
                const cantidadActual = parseInt(inputCant.value);

                if (cantidadActual < stockDisponible) {
                    inputCant.value = cantidadActual + 1;
                } else {
                    alert("No es posible aumentar la cantidad solo quedan: " + stockDisponible + " unidades en stock.");
                }
            });

            btnRestar.addEventListener('click', () => {
                if (parseInt(inputCant.value) > 1) {
                    inputCant.value = parseInt(inputCant.value) - 1;
                }
            });
        }
        const btnAnadir = document.querySelector('.btn-añadir');

        if (btnAnadir) {
            btnAnadir.addEventListener('click', () => {
                const cantidad = parseInt(inputCant.value);

                const idNumerico = parseInt(idProducto); 
                const stockDisponible = producto[idNumerico].stock;

                let carrito = JSON.parse(localStorage.getItem('carritoJC')) || [];
                
                const indexEnCarrito = carrito.findIndex(item => parseInt(item.id) === idNumerico);

                if (indexEnCarrito !== -1) {
                    const nuevaCantidadTotal = carrito[indexEnCarrito].cantidad + cantidad;
                    
                    if (nuevaCantidadTotal <= stockDisponible) {
                        carrito[indexEnCarrito].cantidad = nuevaCantidadTotal;
                        localStorage.setItem('carritoJC', JSON.stringify(carrito));
                        alert("¡Agregaste más botellas al carrito!");
                    } else {
                        alert("¡No puedes llevar tanto! Sumando lo que ya tienes en el carrito, superas el stock (" + stockDisponible + ").");
                    }
                } else {
                    if (cantidad <= stockDisponible) {
                        carrito.push({
                            id: idNumerico,
                            nombre: producto[idNumerico].nombre,
                            precio: producto[idNumerico].precio,
                            cantidad: cantidad,
                            imagen: producto[idNumerico].imagen,
                            stock: stockDisponible 
                        });
                        
                        localStorage.setItem('carritoJC', JSON.stringify(carrito));
                        alert("¡Se fue al carrito!");
                    } else {
                        alert("¡No nos queda tanto stock!");
                    }
                }
            });
        }
        
        
        const contenedorCarrusel = document.getElementById('carrusel-aleatorio');

        if (contenedorCarrusel && typeof producto !== 'undefined') {
            const productosDisponibles = producto.filter((prod, index) => index != idProducto);

            const productosMezclados = productosDisponibles.sort(() => 0.5 - Math.random());

            const recomendados = productosMezclados.slice(0, 8);

        let htmlCarrusel = '';
        recomendados.forEach(prod => {
        const indexOriginal = producto.indexOf(prod); 
        
        htmlCarrusel += `
            <article class="tarjeta">
                <a href="detalleProducto.html?id=${indexOriginal}">
                    <img src="${prod.imagen}" alt="${prod.nombre}">
                </a>
                <div class="info-tarjeta">
                    <p class="marca-tarjeta">BOTILLERIA J&C</p>
                    
                    <a href="detalleProducto.html?id=${indexOriginal}" style="text-decoration: none; color: inherit;">
                        <h3 class="nombre-producto">${prod.nombre}</h3>
                    </a>
                    
                    <p class="precio-producto">$${prod.precio.toLocaleString('es-CL')}</p>
                    <button class="btn-añadir-recomendado" data-id="${indexOriginal}">Añadir 🛒</button>
                </div>
            </article>
        `;
    });

        contenedorCarrusel.innerHTML = htmlCarrusel;
    }
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-añadir-recomendado')) {

            const idNumerico = parseInt(e.target.getAttribute('data-id'));

            const cantidad = 1; 
            const stockDisponible = producto[idNumerico].stock;

            let carrito = JSON.parse(localStorage.getItem('carritoJC')) || [];
            
            const indexEnCarrito = carrito.findIndex(item => parseInt(item.id) === idNumerico);

            if (indexEnCarrito !== -1) {
                if (carrito[indexEnCarrito].cantidad + cantidad <= stockDisponible) {
                    carrito[indexEnCarrito].cantidad += cantidad;
                    localStorage.setItem('carritoJC', JSON.stringify(carrito));
                    alert("¡Sumaste otra botella de " + producto[idNumerico].nombre + " al carrito!");
                } else {
                    alert("¡Llegaste al tope! Ya tienes el máximo stock (" + stockDisponible + ") en tu carrito.");
                }
            } else {
                if (stockDisponible >= cantidad) {
                    carrito.push({
                        id: idNumerico,
                        nombre: producto[idNumerico].nombre,
                        precio: producto[idNumerico].precio,
                        cantidad: cantidad,
                        imagen: producto[idNumerico].imagen,
                        stock: stockDisponible 
                    });
                    
                    localStorage.setItem('carritoJC', JSON.stringify(carrito));
                    alert("¡" + producto[idNumerico].nombre + " se fue al carrito!");
                } else {
                    alert("nos quedamos sin stock!");
                }
            }
        }
    });
    function cerrarSesion() {
        localStorage.removeItem("usuarioActivo");
        localStorage.removeItem("rolUsuario");
        
        alert("¡Sesión cerrada con éxito!");
        window.location.href = "index.html";
    }
    function verificarEstadoSesion() {
        const usuarioActivo = localStorage.getItem("usuarioActivo");
        const btnLogin = document.getElementById("btn-login");
        const btnLogout = document.getElementById("btn-logout");

        if (usuarioActivo) {
            if (btnLogin) btnLogin.style.display = "none";
            if (btnLogout) btnLogout.style.display = "inline";
        } else {
            if (btnLogin) btnLogin.style.display = "inline";
            if (btnLogout) btnLogout.style.display = "none";
        }
    }
    document.addEventListener("DOMContentLoaded", verificarEstadoSesion);
    </script>
