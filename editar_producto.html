<script>
    function validarcodigo() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        const letras = "abcdefghijklmnñopqrstuvwxyzáéíóú";
        codigo_ingresado = datosForm.get("codigo").trim().toLowerCase();
        let soloLetras = codigo_ingresado.length >= 3;
  
        for (let i = 0; i < codigo_ingresado.length; i++) {
            const caracter = codigo_ingresado[i];
        if (!letras.includes(caracter)) {
            soloLetras = false;
            }
        }
        if(soloLetras == true){
          let caja_error = document.getElementById("mensaje_codigo");
          caja_error.innerHTML = "El codigo ingresado es valido";
          caja_error.className = "valido";
        }
        else {
            let caja_error = document.getElementById("mensaje_codigo");
            caja_error.innerHTML = "El codigo ingresado no es valido";
            caja_error.className = "invalido";
        }
      }
      function validarnombre() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        nombre_ingresado = datosForm.get("nombre")
        var valido = isNaN(nombre_ingresado);
        valido = valido && (nombre_ingresado.length < 100);
        if(valido == true){
          let caja_error = document.getElementById("mensaje_nombre");
          caja_error.innerHTML = "El nombre ingresado es valido";
          caja_error.className = "valido";
        }
        else {
            let caja_error = document.getElementById("mensaje_nombre");
            caja_error.innerHTML = "El nombre ingresado no es valido";
            caja_error.className = "invalido";
        }
      }
      function validardescripcion() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        descripcion = datosForm.get("descripcion")
        var valido = isNaN(descripcion);
        valido = valido && (descripcion.length < 100) || (descripcion.length === 0);
        if(valido == true){
          let caja_error = document.getElementById("mensaje_descripcion");
          caja_error.innerHTML = "La descripcion ingresada es valida";
          caja_error.className = "valido";
        }
        else {
            let caja_error = document.getElementById("mensaje_descripcion");
            caja_error.innerHTML = "La descripcion ingresada no es valida";
            caja_error.className = "invalido";
        }
      }
      function validarprecio() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        precio = datosForm.get("precio")
        const numero = Number(precio); // aca transformo el texto a number
        const valido = precio.length > 0 && !isNaN(numero) && numero >= 0;
        if (valido) {
          let caja_error = document.getElementById("mensaje_precio");
          caja_error.innerHTML = "El precio es valido";
          caja_error.className = "valido";
        }
        else if (valido && numero === 0 ) {
          let caja_error = document.getElementById("mensaje_precio");
          caja_error.innerHTML = "Producto FREE";
          caja_error.className = "valido";
        }
        else {
          let caja_error = document.getElementById("mensaje_precio");
          caja_error.innerHTML = "Ingresa un precio de 0 o más";
          caja_error.className = "invalido";
        }
      }
      function validarstock() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        stock = datosForm.get("stock")
        const numero = Number(stock); // aca transformo el texto a number
        const valido = stock.length > 0 && !isNaN(numero) && numero >= 0;
        if (valido) {
          let caja_error = document.getElementById("mensaje_stock");
          caja_error.innerHTML = "El stock es valido";
          caja_error.className = "valido";
        }
        else {
          let caja_error = document.getElementById("mensaje_stock");
          caja_error.innerHTML = "Ingresa un stock de 0 o más";
          caja_error.className = "invalido";
        }
      }
      function validarstockC() {
        const form = document.getElementById("form");
        const datosForm = new FormData(form);
        stock = datosForm.get("stock_critico");
        const numero = Number(stock);
        const valido = stock.length >= 0 && !isNaN(numero) && numero >= 0;
  
        if (valido) {
          let caja_error = document.getElementById("mensaje_stock_critico");
          caja_error.innerHTML = "El stock es valido";
          caja_error.className = "valido";
  
          const stockActual = Number(datosForm.get("stock"));
          if (stockActual <= numero) {
            alert("Alerta: el stock está igual o por debajo del crítico");
          }
        } else {
          let caja_error = document.getElementById("mensaje_stock_critico");
          caja_error.innerHTML = "Ingresa un stock de 0 o más";
          caja_error.className = "invalido";
        }
      }
      function validarcategoria() {
        const form = document.getElementById("form");
        const datos = new FormData(form);
        const categoria = datos.get("categoria");
        const valido = categoria !== "";
  
        if (valido) {
          let caja_error = document.getElementById("mensaje_categoria");
          caja_error.innerHTML = "Categoría seleccionada";
          caja_error.className = "valido";
        } else {
          let caja_error = document.getElementById("mensaje_categoria");
          caja_error.innerHTML = "Elige una categoría";
          caja_error.className = "invalido";
        }
      }
</script>
