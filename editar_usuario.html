<script>
  function validarRut() {
      const form = document.getElementById("form");
      const datosForm = new FormData(form);
      var rutCompleto = datosForm.get("run");
      // leva el \. porque el . solo significa cualquier caracter
      rutCompleto = rutCompleto.replace(/\./g, "").replace(/-/g, "").toUpperCase();

      var numero = rutCompleto.slice(0, -1);
      var dvIngresado = rutCompleto.slice(-1);

      var suma = 0;
      var multiplicador = 2;

      for (var i = numero.length - 1; i >= 0; i--) {
          suma += parseInt(numero[i]) * multiplicador;
          // (condicion) ? si es true : si es false
          // condición ? valorSiVerdadero : valorSiFalso
          // ? = si es verdadero
          // : = si es falso
          multiplicador = (multiplicador < 7) ? multiplicador + 1 : 2;
          //if (multiplicador < 7) {
          //  multiplicador++;
          //} else {
          //  multiplicador = 2;    
          //}
      }

      var resto = suma % 11;
      var dvCalculado = 11 - resto;
      if (dvCalculado === 11) dvCalculado = "0";
      else if (dvCalculado === 10) dvCalculado = "K";
      else dvCalculado = dvCalculado.toString();

      var valido = (dvCalculado === dvIngresado);
      if(valido == true){
          let caja_error = document.getElementById("mensaje_run");
          caja_error.innerHTML = "El rut ingresado es valido";
          caja_error.className = "valido";
      }
      else {
          let caja_error = document.getElementById("mensaje_run");
          caja_error.innerHTML = "El rut ingresado no es valido";
          caja_error.className = "invalido";
      }
  }
  function validarnombre() {
      const form = document.getElementById("form");
      const datosForm = new FormData(form);
      nombre_ingresado = datosForm.get("nombre")
      var valido = isNaN(nombre_ingresado);
      valido = valido && (nombre_ingresado.length <= 50);
      if(valido == true){
        let caja_error = document.getElementById("mensaje_nombre");
        caja_error.innerHTML = "El nombre ingresado es valido";
        caja_error.className = "valido";
      }
      else {
          let caja_error = document.getElementById("mensaje_nombre");
          caja_error.innerHTML = "El nombre ingresado no es valido";
          caja_error.className = "invalido";
      }
    }
    function validarapellido() {
      const form = document.getElementById("form");

      nombre_ingresado = datosForm.get("apellidos")

      if(valido == true){
        let caja_error = document.getElementById("mensaje_apellidos");
        caja_error.innerHTML = "El nombre ingresado es valido";
        caja_error.className = "valido";
      }
      else {
          let caja_error = document.getElementById("mensaje_apellidos");
          caja_error.innerHTML = "El nombre ingresado no es valido";
          caja_error.className = "invalido";
      }
    }
    function validarcorreo() {
    const form = document.getElementById("form");
    const datosForm = new FormData(form);
    const correo = datosForm.get("correo").trim().toLowerCase();

    const terminaBien =
      correo.endsWith("@duoc.cl") ||
      correo.endsWith("@profesor.duoc.cl") ||
      correo.endsWith("@gmail.com");

    const valido = terminaBien && correo.length <= 100 && correo.indexOf("@") > 0;

    if (valido == true) {
      let caja_error = document.getElementById("mensaje_correo");
      caja_error.innerHTML = "El correo ingresado es valido";
      caja_error.className = "valido";
    } else {
      let caja_error = document.getElementById("mensaje_correo");
      caja_error.innerHTML = "Solo se permiten @duoc.cl, @profesor.duoc.cl o @gmail.com";
      caja_error.className = "invalido";
    }
  }
  function validartipoU() {
      const form = document.getElementById("form");
      const datos = new FormData(form);
      const categoria = datos.get("tipoU");
      const valido = categoria !== "";

      if (valido) {
        let caja_error = document.getElementById("mensaje_tipo");
        caja_error.innerHTML = "Tipo de usuario seleccionado correctamente";
        caja_error.className = "valido";
      } else {
        let caja_error = document.getElementById("mensaje_tipo");
        caja_error.innerHTML = "Elige un tipo de usuario";
        caja_error.className = "invalido";
      }
    }
    function validarR() {

    function validarC() {
      const form = document.getElementById("form");

    function validardireccion() {

          caja_error.innerHTML = "La direccion ingresada no es valida";
          caja_error.className = "invalido";
      }
    }
</script>
