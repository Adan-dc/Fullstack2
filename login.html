<body>

        </nav>

    <div class="contenedor-logo">
        <img class="img-boti2" src="imagenes/content.png">

    </div>
    <div>
        <fieldset class="contorno-registro acceso-cliente">
            <h3 class="subtitulo">Inicio sesion</h3>
            <label for="correo" class="correo">CORREO</label>
            <input type="email" name="campo_correo" id="correo" class="input-estandar">
            <label for="contraseña" class="contraseña">CONTRASEÑA</label>
            <input type="password" name="campo_contraseña" id="clave" class="input-estandar">
            <button class="btn-iniciar-sesion" type="button" onclick="iniciarSesion()">Iniciar Sesion</button>
        </fieldset>
        <p class="link-registro"><a href="registro-usuario.html">REGISTRARSE</a></p>
    </div>
  <script>
  const cuentas = [
    {
      correo: "cristobal@gmail.com",
      clave: "admin123",
      rol: "administrador"
    },
    {
      correo: "example@gmail.com",
      clave: "venta123",
      rol: "vendedor"
    },
    {
      correo: "olicares@gmail.com",
      clave: "1234",
      rol: "cliente"
    }
  ];

    function iniciarSesion() {
        const correo = document.getElementById("correo").value.trim().toLowerCase();
        const clave = document.getElementById("clave").value.trim();

        document.querySelectorAll('.texto-error').forEach(el => el.remove());
        document.querySelectorAll('.input-estandar').forEach(el => el.classList.remove('input-error'));

        let hayError = false;

        function marcarError(idCampo, mensaje) {
            const campo = document.getElementById(idCampo);
            campo.classList.add('input-error'); 
            
            const spanError = document.createElement('span');
            spanError.className = 'texto-error'; 
            spanError.innerText = mensaje;
            
            campo.parentNode.insertBefore(spanError, campo.nextSibling);
            hayError = true;
        }

        if (!correo) {
            marcarError("correo", "El correo es obligatorio.");
        } else if (correo.length > 100) {
            marcarError("correo", "El correo no puede superar los 100 caracteres.");
        } else {
            const dominiosPermitidos = ['@duoc.cl', '@profesor.duoc.cl', '@gmail.com'];
            const correoValido = dominiosPermitidos.some(dominio => correo.endsWith(dominio));
            if (!correoValido) {
                marcarError("correo", "El correo solo puede terminar en @duoc.cl, @profesor.duoc.cl o @gmail.com");
            }
        }

        if (!clave) {
            marcarError("clave", "La contraseña es obligatoria.");
        } else if (clave.length < 4 || clave.length > 10) {
            marcarError("clave", "La contraseña debe tener entre 4 y 10 caracteres.");
        }

        if (hayError) return;

        const cuentaEncontrada = cuentas.find(c => c.correo === correo && c.clave === clave);

        if (!cuentaEncontrada) {
            marcarError("correo", "El correo o la contraseña son incorrectos");
            marcarError("clave", "El correo o la contraseña son incorrectos");
            return;
        }

        localStorage.setItem("rolUsuario", cuentaEncontrada.rol);
        localStorage.setItem("usuarioActivo", cuentaEncontrada.correo);

        if (cuentaEncontrada.rol === "administrador") {
            window.location.href = "dashboard.html";
        } else if (cuentaEncontrada.rol === "vendedor") {
            window.location.href = "mostrar_producto.html";
        } else {
            window.location.href = "index.html";
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("usuarioActivo");
        localStorage.removeItem("rolUsuario");
        alert("¡Sesión cerrada con éxito!");
        window.location.href = "index.html";
    }

    function verificarEstadoSesion() {
        const usuarioActivo = localStorage.getItem("usuarioActivo");
        const btnLogin = document.getElementById("btn-login");
        const btnLogout = document.getElementById("btn-logout");

        if (usuarioActivo) {
            if (btnLogin) btnLogin.style.display = "none";
            if (btnLogout) btnLogout.style.display = "inline";
        } else {
            if (btnLogin) btnLogin.style.display = "inline";
            if (btnLogout) btnLogout.style.display = "none";
        }
    }

    document.addEventListener("DOMContentLoaded", verificarEstadoSesion);

  function cerrarSesion() {
      localStorage.removeItem("usuarioActivo");
      localStorage.removeItem("rolUsuario");
      
      alert("¡Sesión cerrada con éxito!");
      window.location.href = "index.html";
  }
function verificarEstadoSesion() {
      const usuarioActivo = localStorage.getItem("usuarioActivo");
      const btnLogin = document.getElementById("btn-login");
      const btnLogout = document.getElementById("btn-logout");

      if (usuarioActivo) {
          if (btnLogin) btnLogin.style.display = "none";
          if (btnLogout) btnLogout.style.display = "inline";
      } else {
          if (btnLogin) btnLogin.style.display = "inline";
          if (btnLogout) btnLogout.style.display = "none";
      }
  }
    document.addEventListener("DOMContentLoaded", verificarEstadoSesion);
</script>
